openapi: 3.0.3
info:
  title: B Mansion API
  version: 0.3.0
  description: |
    Contract-first API. Edit this file first, then run `go generate ./...`
    in backend/ and the frontend client generator.

    - Money is a decimal string with 2 places (e.g. "4512.00"), never a number.
    - Timestamps are ISO 8601 UTC; dates are `yyyy-mm-dd` (Thai calendar day);
      billing periods are `yyyy-mm`.
    - Errors are RFC 9457 Problem Details with a stable `code`.
    - Auth is an httpOnly session cookie set by the login endpoints.
      `/admin/*` requires the admin; `/tenant/*` requires an ACTIVE tenant.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: auth
  - name: tenant-accounts
  - name: rooms
  - name: tenant
  - name: utility-rates
  - name: invoices
  - name: slips
  - name: maintenance

security:
  - sessionCookie: []

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: Service is up and the database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------- auth
  /auth/admin/login:
    post:
      tags: [auth]
      operationId: adminLogin
      summary: Admin login (P-A01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/LoggedIn"
        default:
          $ref: "#/components/responses/Problem"

  /auth/tenant/login:
    post:
      tags: [auth]
      operationId: tenantLogin
      summary: Tenant login. PENDING and INACTIVE accounts may log in but cannot see room data.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/LoggedIn"
        default:
          $ref: "#/components/responses/Problem"

  /auth/tenant/register:
    post:
      tags: [auth]
      operationId: registerTenant
      summary: Tenant self-registration; the account waits (PENDING) until the admin assigns a room
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTenantRequest"
      responses:
        "201":
          description: Account created in PENDING status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAccount"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              description: Clears the session cookie
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  # ------------------------------------------------------ tenant accounts
  /admin/tenant-accounts:
    get:
      tags: [tenant-accounts]
      operationId: listTenantAccounts
      summary: Tenant accounts by status (P-A08 tabs)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountStatus"
      responses:
        "200":
          description: Accounts, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantAccount"
        default:
          $ref: "#/components/responses/Problem"

  /admin/tenant-accounts/{accountId}/assign:
    post:
      tags: [tenant-accounts]
      operationId: assignRoom
      summary: Bind an account to a room (M-06). PENDING or INACTIVE → ACTIVE.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoomRequest"
      responses:
        "200":
          description: Account is ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAccount"
        default:
          $ref: "#/components/responses/Problem"

  /admin/tenant-accounts/{accountId}/unassign:
    post:
      tags: [tenant-accounts]
      operationId: unassignRoom
      summary: Unbind an account when the tenant moves out. ACTIVE → INACTIVE; ends all its sessions.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Account is INACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAccount"
        default:
          $ref: "#/components/responses/Problem"

  /admin/tenant-accounts/{accountId}/password:
    put:
      tags: [tenant-accounts]
      operationId: resetTenantPassword
      summary: Admin sets a new password for a tenant; ends all its sessions
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------- rooms
  /admin/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: All rooms (P-A05). Not paginated.
      parameters:
        - name: floor
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Rooms ordered by floor and number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        default:
          $ref: "#/components/responses/Problem"

  /admin/rooms/{roomNumber}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Room detail (P-A06)
      parameters:
        - $ref: "#/components/parameters/RoomNumber"
      responses:
        "200":
          description: Room with leases and recurring charges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [rooms]
      operationId: updateRoom
      summary: Change rent or meter digits. Affects only drafts created afterwards (INV-4).
      parameters:
        - $ref: "#/components/parameters/RoomNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        default:
          $ref: "#/components/responses/Problem"

  /admin/rooms/{roomNumber}/leases:
    post:
      tags: [rooms]
      operationId: createLease
      summary: Add a lease (M-07). Leases of a room may not overlap.
      parameters:
        - $ref: "#/components/parameters/RoomNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseRequest"
      responses:
        "201":
          description: Lease created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        default:
          $ref: "#/components/responses/Problem"

  /admin/leases/{leaseId}:
    patch:
      tags: [rooms]
      operationId: updateLease
      summary: Edit a lease (M-07)
      parameters:
        - $ref: "#/components/parameters/LeaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseRequest"
      responses:
        "200":
          description: Lease updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        default:
          $ref: "#/components/responses/Problem"

  /admin/rooms/{roomNumber}/recurring-charges:
    post:
      tags: [rooms]
      operationId: createRecurringCharge
      summary: Add a monthly service charge (M-08)
      parameters:
        - $ref: "#/components/parameters/RoomNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringChargeRequest"
      responses:
        "201":
          description: Charge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringCharge"
        default:
          $ref: "#/components/responses/Problem"

  /admin/recurring-charges/{chargeId}:
    patch:
      tags: [rooms]
      operationId: updateRecurringCharge
      summary: Edit or switch a monthly service charge on/off (M-08)
      parameters:
        - $ref: "#/components/parameters/ChargeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecurringChargeRequest"
      responses:
        "200":
          description: Charge updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringCharge"
        default:
          $ref: "#/components/responses/Problem"

  /tenant/room:
    get:
      tags: [tenant]
      operationId: getTenantRoom
      summary: The room the logged-in tenant is bound to
      responses:
        "200":
          description: Tenant's room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantRoom"
        default:
          $ref: "#/components/responses/Problem"

  # -------------------------------------------------------- utility rates
  /admin/utility-rates:
    get:
      tags: [utility-rates]
      operationId: listUtilityRates
      summary: Current rates and full history (P-A12)
      responses:
        "200":
          description: Rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtilityRates"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [utility-rates]
      operationId: createUtilityRate
      summary: Add a new rate (M-09). Append-only; must start after the latest rate of that type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUtilityRateRequest"
      responses:
        "201":
          description: Rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtilityRate"
        default:
          $ref: "#/components/responses/Problem"

  # ------------------------------------------------------------- invoices
  /admin/billing-periods/{period}/rooms/{roomNumber}/invoice:
    get:
      tags: [invoices]
      operationId: getRoomInvoice
      summary: The invoice of a room for a billing period (P-A04); 404 if not created yet
      parameters:
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/RoomNumber"
      responses:
        "200":
          $ref: "#/components/responses/Invoice"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [invoices]
      operationId: createInvoiceDraft
      summary: Create a draft, snapshotting rent, rates and recurring charges (INV-4)
      parameters:
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/RoomNumber"
      responses:
        "201":
          $ref: "#/components/responses/Invoice"
        default:
          $ref: "#/components/responses/Problem"

  /admin/invoices/{invoiceId}:
    get:
      tags: [invoices]
      operationId: getInvoice
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          $ref: "#/components/responses/Invoice"
        default:
          $ref: "#/components/responses/Problem"

  /admin/invoices/{invoiceId}/meters:
    patch:
      tags: [invoices]
      operationId: setInvoiceMeters
      summary: Enter meter readings (DRAFT only). Lower than previous requires rolloverConfirmed (M-02).
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMetersRequest"
      responses:
        "200":
          $ref: "#/components/responses/Invoice"
        default:
          $ref: "#/components/responses/Problem"

  /admin/invoices/{invoiceId}/lines:
    post:
      tags: [invoices]
      operationId: addInvoiceLine
      summary: Add a discount (negative) or penalty (positive) line (DRAFT only)
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLineRequest"
      responses:
        "201":
          $ref: "#/components/responses/Invoice"
        default:
          $ref: "#/components/responses/Problem"

  /admin/invoices/{invoiceId}/lines/{lineId}:
    delete:
      tags: [invoices]
      operationId: removeInvoiceLine
      summary: Remove a discount or penalty line (DRAFT only)
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - name: lineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/Invoice"
        default:
          $ref: "#/components/responses/Problem"

  /admin/invoices/{invoiceId}/issue:
    post:
      tags: [invoices]
      operationId: issueInvoice
      summary: Send the invoice to the tenant (M-01). It can no longer be edited.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          $ref: "#/components/responses/Invoice"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------------- slips
  /tenant/invoices:
    get:
      tags: [slips]
      operationId: listTenantInvoices
      summary: Invoices of the tenant's room (issued and paid; drafts are hidden), newest first
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceSummary"
        default:
          $ref: "#/components/responses/Problem"

  /tenant/invoices/{invoiceId}:
    get:
      tags: [slips]
      operationId: getTenantInvoice
      summary: Invoice detail with slips (P-T06). 404 for another room's invoice.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          $ref: "#/components/responses/Invoice"
        default:
          $ref: "#/components/responses/Problem"

  /tenant/invoices/{invoiceId}/slips/upload-url:
    post:
      tags: [slips]
      operationId: createSlipUploadUrl
      summary: Step 1 — get a presigned URL to upload a slip image directly to storage
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          $ref: "#/components/responses/UploadUrl"
        default:
          $ref: "#/components/responses/Problem"

  /tenant/invoices/{invoiceId}/slips:
    post:
      tags: [slips]
      operationId: submitSlip
      summary: Step 3 — confirm the uploaded slip (M-11). The invoice shows PENDING_VERIFICATION.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitSlipRequest"
      responses:
        "201":
          description: Slip submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSlip"
        default:
          $ref: "#/components/responses/Problem"

  /admin/slips:
    get:
      tags: [slips]
      operationId: listSlips
      summary: Slip verification queue (P-A07), oldest first
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SlipStatus"
      responses:
        "200":
          description: Slips with their invoice
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlipQueueItem"
        default:
          $ref: "#/components/responses/Problem"

  /admin/slips/{slipId}/approve:
    post:
      tags: [slips]
      operationId: approveSlip
      summary: Approve a slip; an ISSUED invoice becomes PAID in the same transaction
      parameters:
        - $ref: "#/components/parameters/SlipId"
      responses:
        "200":
          $ref: "#/components/responses/SlipQueueItem"
        default:
          $ref: "#/components/responses/Problem"

  /admin/slips/{slipId}/reject:
    post:
      tags: [slips]
      operationId: rejectSlip
      summary: Reject a slip with a reason (M-05); the tenant can submit another
      parameters:
        - $ref: "#/components/parameters/SlipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectSlipRequest"
      responses:
        "200":
          $ref: "#/components/responses/SlipQueueItem"
        default:
          $ref: "#/components/responses/Problem"

  # ---------------------------------------------------------- maintenance
  /tenant/maintenance-requests/upload-url:
    post:
      tags: [maintenance]
      operationId: createMaintenanceUploadUrl
      summary: Get a presigned URL to upload one repair photo (up to 3 per request)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          $ref: "#/components/responses/UploadUrl"
        default:
          $ref: "#/components/responses/Problem"

  /tenant/maintenance-requests:
    get:
      tags: [maintenance]
      operationId: listTenantMaintenanceRequests
      summary: Repair requests of the tenant's room, newest first
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceRequest"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [maintenance]
      operationId: createMaintenanceRequest
      summary: Report a repair (P-T09)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenanceRequest"
      responses:
        "201":
          $ref: "#/components/responses/MaintenanceRequest"
        default:
          $ref: "#/components/responses/Problem"

  /tenant/maintenance-requests/{requestId}:
    get:
      tags: [maintenance]
      operationId: getTenantMaintenanceRequest
      summary: One repair request of the tenant's room; 404 for another room's
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          $ref: "#/components/responses/MaintenanceRequest"
        default:
          $ref: "#/components/responses/Problem"

  /admin/maintenance-requests:
    get:
      tags: [maintenance]
      operationId: listMaintenanceRequests
      summary: All repair requests (P-A09), newest first
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaintenanceStatus"
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceRequest"
        default:
          $ref: "#/components/responses/Problem"

  /admin/maintenance-requests/{requestId}:
    get:
      tags: [maintenance]
      operationId: getMaintenanceRequest
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          $ref: "#/components/responses/MaintenanceRequest"
        default:
          $ref: "#/components/responses/Problem"

  /admin/maintenance-requests/{requestId}/status:
    patch:
      tags: [maintenance]
      operationId: updateMaintenanceStatus
      summary: Move a request forward; steps may be skipped, never reversed (§6.6)
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMaintenanceStatusRequest"
      responses:
        "200":
          $ref: "#/components/responses/MaintenanceRequest"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bm_session

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomNumber:
      name: roomNumber
      in: path
      required: true
      schema:
        type: string
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChargeId:
      name: chargeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Period:
      name: period
      in: path
      required: true
      description: Billing period yyyy-mm
      schema:
        $ref: "#/components/schemas/BillingPeriod"
    SlipId:
      name: slipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LoggedIn:
      description: Logged in; the session cookie is set
      headers:
        Set-Cookie:
          description: httpOnly session cookie
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Me"
    Invoice:
      description: Invoice
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Invoice"
    UploadUrl:
      description: Presigned upload; PUT the file to uploadUrl with exactly these headers before it expires
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadUrl"
    SlipQueueItem:
      description: Slip with its invoice
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SlipQueueItem"
    MaintenanceRequest:
      description: Repair request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MaintenanceRequest"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [OK]

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable UPPER_SNAKE_CASE error code, mapped to a Thai message by the frontend
        detail:
          type: string
        requestId:
          type: string

    Money:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      example: "4512.00"

    BillingPeriod:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      example: "2026-11"

    # auth
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    Role:
      type: string
      enum: [ADMIN, TENANT]

    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, INACTIVE]

    Me:
      type: object
      required: [id, role, username]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        username:
          type: string
        fullName:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        roomNumber:
          type: string
          description: Only for ACTIVE tenants

    RegisterTenantRequest:
      type: object
      required: [username, password, fullName, phone]
      properties:
        username:
          type: string
          description: 3–32 characters, a–z 0–9 . _ -
        password:
          type: string
          format: password
          description: 8–128 characters
        fullName:
          type: string
        phone:
          type: string
          description: 9–10 digits

    TenantAccount:
      type: object
      required: [id, username, fullName, phone, status, registeredAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        phone:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        roomNumber:
          type: string
        registeredAt:
          type: string
          format: date-time
        unassignedAt:
          type: string
          format: date-time

    AssignRoomRequest:
      type: object
      required: [roomNumber]
      properties:
        roomNumber:
          type: string

    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password

    # rooms
    RoomStatus:
      type: string
      enum: [VACANT, OCCUPIED]
      description: OCCUPIED when a lease is in effect today

    RoomAccount:
      type: object
      required: [id, username, fullName, phone, registeredAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        phone:
          type: string
        registeredAt:
          type: string
          format: date-time

    Room:
      type: object
      required: [roomNumber, floor, basePrice, status]
      properties:
        roomNumber:
          type: string
        floor:
          type: integer
        basePrice:
          $ref: "#/components/schemas/Money"
        electricMeterDigits:
          type: integer
        waterMeterDigits:
          type: integer
        status:
          $ref: "#/components/schemas/RoomStatus"
        account:
          $ref: "#/components/schemas/RoomAccount"
        activeLease:
          $ref: "#/components/schemas/Lease"

    RoomDetail:
      allOf:
        - $ref: "#/components/schemas/Room"
        - type: object
          required: [leases, recurringCharges]
          properties:
            leases:
              type: array
              items:
                $ref: "#/components/schemas/Lease"
            recurringCharges:
              type: array
              items:
                $ref: "#/components/schemas/RecurringCharge"

    UpdateRoomRequest:
      type: object
      properties:
        basePrice:
          $ref: "#/components/schemas/Money"
        electricMeterDigits:
          type: integer
          minimum: 1
          maximum: 9
        waterMeterDigits:
          type: integer
          minimum: 1
          maximum: 9

    Lease:
      type: object
      required: [id, tenantName, startDate, endDate]
      properties:
        id:
          type: string
          format: uuid
        tenantName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    LeaseRequest:
      type: object
      required: [tenantName, startDate, endDate]
      properties:
        tenantName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    RecurringCharge:
      type: object
      required: [id, name, amount, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        active:
          type: boolean
          description: Included in new invoices when true

    CreateRecurringChargeRequest:
      type: object
      required: [name, amount]
      properties:
        name:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        active:
          type: boolean
          default: true

    UpdateRecurringChargeRequest:
      type: object
      properties:
        name:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        active:
          type: boolean

    TenantRoom:
      type: object
      required: [roomNumber, floor]
      properties:
        roomNumber:
          type: string
        floor:
          type: integer
        activeLease:
          $ref: "#/components/schemas/Lease"

    # utility rates
    UtilityType:
      type: string
      enum: [ELECTRICITY, WATER]

    UtilityRate:
      type: object
      required: [id, utilityType, perUnit, effectiveFrom, createdAt]
      properties:
        id:
          type: string
          format: uuid
        utilityType:
          $ref: "#/components/schemas/UtilityType"
        perUnit:
          $ref: "#/components/schemas/Money"
        effectiveFrom:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    UtilityRates:
      type: object
      required: [electricity, water, history]
      properties:
        electricity:
          $ref: "#/components/schemas/UtilityRate"
        water:
          $ref: "#/components/schemas/UtilityRate"
        history:
          type: array
          description: All rates, newest effective date first
          items:
            $ref: "#/components/schemas/UtilityRate"

    CreateUtilityRateRequest:
      type: object
      required: [utilityType, perUnit, effectiveFrom]
      properties:
        utilityType:
          $ref: "#/components/schemas/UtilityType"
        perUnit:
          $ref: "#/components/schemas/Money"
        effectiveFrom:
          type: string
          format: date

    # invoices
    BillDisplayStatus:
      type: string
      enum: [UNBILLED, DRAFT, ISSUED, PENDING_VERIFICATION, OVERDUE, PAID]
      description: Computed by the backend from the stored status, slips and due date

    InvoiceLineType:
      type: string
      enum: [RENT, ELECTRICITY, WATER, RECURRING, DISCOUNT, PENALTY]

    InvoiceLine:
      type: object
      required: [type, description, amount]
      properties:
        id:
          type: string
          format: uuid
          description: Present on DISCOUNT and PENALTY lines, which can be removed while DRAFT
        type:
          $ref: "#/components/schemas/InvoiceLineType"
        description:
          type: string
        amount:
          $ref: "#/components/schemas/Money"

    MeterDetail:
      type: object
      required: [meterDigits, ratePerUnit, rolloverConfirmed]
      properties:
        previousReading:
          type: integer
          format: int64
          description: Defaults to the latest issued invoice's reading (INV-8); absent on a room's first invoice until entered
        currentReading:
          type: integer
          format: int64
        units:
          type: integer
          format: int64
        ratePerUnit:
          $ref: "#/components/schemas/Money"
        meterDigits:
          type: integer
        rolloverConfirmed:
          type: boolean

    UsageCheck:
      type: object
      required: [abnormal]
      properties:
        abnormal:
          type: boolean
          description: Units are more than double the 3-month average (M-03). Warning only.
        percentOfAverage:
          type: integer
          format: int64

    AbnormalUsage:
      type: object
      required: [electricity, water]
      properties:
        electricity:
          $ref: "#/components/schemas/UsageCheck"
        water:
          $ref: "#/components/schemas/UsageCheck"

    Invoice:
      type: object
      required: [id, invoiceNumber, roomNumber, billingPeriod, dueDate, status, electricity, water, lines, total, abnormalUsage, slips, createdAt]
      properties:
        slips:
          type: array
          description: Payment slips of this invoice, oldest first (an invoice may have several)
          items:
            $ref: "#/components/schemas/PaymentSlip"
        id:
          type: string
          format: uuid
        invoiceNumber:
          type: string
          example: INV-202611-302
        roomNumber:
          type: string
        billingPeriod:
          $ref: "#/components/schemas/BillingPeriod"
        dueDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/BillDisplayStatus"
        electricity:
          $ref: "#/components/schemas/MeterDetail"
        water:
          $ref: "#/components/schemas/MeterDetail"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLine"
        total:
          $ref: "#/components/schemas/Money"
        abnormalUsage:
          $ref: "#/components/schemas/AbnormalUsage"
        issuedAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    MeterInput:
      type: object
      required: [currentReading]
      properties:
        previousReading:
          type: integer
          format: int64
          description: Override the previous reading, e.g. after a meter replacement (audited)
        currentReading:
          type: integer
          format: int64
        rolloverConfirmed:
          type: boolean
          default: false

    SetMetersRequest:
      type: object
      properties:
        electricity:
          $ref: "#/components/schemas/MeterInput"
        water:
          $ref: "#/components/schemas/MeterInput"

    AddLineRequest:
      type: object
      required: [type, description, amount]
      properties:
        type:
          type: string
          enum: [DISCOUNT, PENALTY]
        description:
          type: string
        amount:
          $ref: "#/components/schemas/Money"

    # uploads
    UploadRequest:
      type: object
      required: [contentType, sizeBytes]
      properties:
        contentType:
          type: string
          enum: [image/png, image/jpeg]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
          description: Exact file size; it is part of the signature (max 5 MB)

    UploadUrl:
      type: object
      required: [uploadUrl, method, headers, fileKey, expiresAt]
      properties:
        uploadUrl:
          type: string
        method:
          type: string
          example: PUT
        headers:
          type: object
          additionalProperties:
            type: string
          description: Send these headers unchanged with the upload
        fileKey:
          type: string
          description: Pass this back to the API after the upload succeeds
        expiresAt:
          type: string
          format: date-time

    # slips
    SlipStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    SlipRejectReason:
      type: string
      enum: [AMOUNT_MISMATCH, DUPLICATE, UNCLEAR]

    PaymentSlip:
      type: object
      required: [id, imageUrl, submittedAt, status, possibleDuplicate]
      properties:
        id:
          type: string
          format: uuid
        imageUrl:
          type: string
          description: Short-lived signed URL (5 minutes); do not cache
        submittedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/SlipStatus"
        possibleDuplicate:
          type: boolean
          description: The same file was submitted before (warning only)
        rejectReason:
          $ref: "#/components/schemas/SlipRejectReason"
        rejectNote:
          type: string
        reviewedAt:
          type: string
          format: date-time

    SubmitSlipRequest:
      type: object
      required: [fileKey]
      properties:
        fileKey:
          type: string

    RejectSlipRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: "#/components/schemas/SlipRejectReason"
        note:
          type: string

    InvoiceSummary:
      type: object
      required: [id, invoiceNumber, billingPeriod, dueDate, total, status]
      properties:
        id:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        billingPeriod:
          $ref: "#/components/schemas/BillingPeriod"
        dueDate:
          type: string
          format: date
        total:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/BillDisplayStatus"

    SlipQueueItem:
      type: object
      required: [slip, invoice, roomNumber]
      properties:
        slip:
          $ref: "#/components/schemas/PaymentSlip"
        roomNumber:
          type: string
        invoice:
          $ref: "#/components/schemas/InvoiceSummary"

    # maintenance
    MaintenanceCategory:
      type: string
      enum: [WATER, ELECTRICITY, AIR_CONDITIONER, FURNITURE]

    MaintenanceStatus:
      type: string
      enum: [NEW, COORDINATING, TECHNICIAN_DISPATCHED, COMPLETED]

    MaintenanceRequest:
      type: object
      required: [id, roomNumber, category, description, images, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        roomNumber:
          type: string
        category:
          $ref: "#/components/schemas/MaintenanceCategory"
        description:
          type: string
        images:
          type: array
          description: Short-lived signed URLs (5 minutes), at most 3
          items:
            type: string
        status:
          $ref: "#/components/schemas/MaintenanceStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateMaintenanceRequest:
      type: object
      required: [category, description]
      properties:
        category:
          $ref: "#/components/schemas/MaintenanceCategory"
        description:
          type: string
        imageKeys:
          type: array
          maxItems: 3
          description: fileKey values from the upload-url endpoint, after uploading
          items:
            type: string

    UpdateMaintenanceStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/MaintenanceStatus"
